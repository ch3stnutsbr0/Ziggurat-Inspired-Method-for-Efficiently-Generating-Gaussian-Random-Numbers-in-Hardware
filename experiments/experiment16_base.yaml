experiment_id: experiment16
output_dir: experiments/results/experiment16_base   # relative to the repository root

# Base case only: Trapezoid without head/tail refinement (H = T = 0), one Philox2x64-10 call per
# sample (trapezoid_philox_base), against the general packed sampler at H = T = 0, Trapezoid with
# xoshiro256+, and Classical (xoshiro256+ and packed Philox). Casual timing, no validation.
layers: [8, 16, 32, 64, 128, 256]
head: 0
tail: 0
variants: [classical_xoshiro, classical_philox, trapezoid_xoshiro, trapezoid_philox, trapezoid_philox_base]
samples: 16777216        # per timed repeat (2^24)
repeats: 7               # interleaved across variants (round robin)
count_samples: 4194304   # untimed pass for PRNG calls per sample and moments
seed: 1
cpu: 3                   # taskset core; null to skip pinning
