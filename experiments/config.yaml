prng:
  type: pcg32  # Also supports xoshiro256plus; omission defaults to pcg32.

# Smoke-test profile. Full Experiment 01 is in experiment_01.yaml.
algorithms:
  basic:
    enabled: true
    layers: [8]
    seeds: [1]

  trapezoid:
    enabled: true
    layers: [8]
    heads: [0]
    tails: [0]
    seeds: [1]

  trapezoid_refined:
    enabled: true
    layers: [8]
    heads: [2]
    tails: [4]
    seeds: [1]

performance:
  enabled: true
  samples: 1000000
  repetitions: 3

validation:
  enabled: true
  samples: 1000000
  significance_level: 0.05
  chi_square:
    bins: 100
    range: [-5.0, 5.0]
    minimum_expected_count: 5
