experiment_id: experiment10
prng:
  type: xoshiro256plus
layers: [8, 16, 32, 64, 128, 256]
# Three configurations per layer count: Classical, unrefined Trapezoid, refined Trapezoid.
configurations:
  - {algorithm: basic}
  - {algorithm: trapezoid, head: 0, tail: 0}
  - {algorithm: trapezoid, head: 2, tail: 4}
seed: 1
samples_per_run: 33554432  # 2^25; fixed for all timing and validation runs.
performance:
  repetitions: 5
  checkpoints: [100000, 1000000, 10000000, 33554432]
  pin_cpu: 7
validation:
  significance_level: 0.05
  chi_square:
    bins: 100
    range: [-5.0, 5.0]
    minimum_expected_count: 5
output_dir: experiments/results/experiment10
